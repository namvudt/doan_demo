x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *bounded-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: heritage
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    logging: *bounded-logging
    build: .
    image: heritage-vqa-api:local
    env_file: .env
    environment: &runtime
      API_ENV: production
      API_MODEL_MODE: ${API_MODEL_MODE:-live}
      API_EMBEDDED_WORKER: "false"
      API_DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://heritage:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/heritage
      API_BOOTSTRAP_TOKEN: ${API_BOOTSTRAP_TOKEN:?Set a token with at least 32 characters}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - asset_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    logging: *bounded-logging
    image: heritage-vqa-api:local
    build: .
    command: ["python", "-m", "api.worker"]
    env_file: .env
    environment: *runtime
    volumes:
      - asset_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  asset_data:
