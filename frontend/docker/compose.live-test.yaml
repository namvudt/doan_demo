name: heritage-fe-live

# Secrets are read by Compose from the existing server file only; never baked
# into the image or passed to the browser. This stack uses separate live-test
# database/assets and localhost ports, without consuming the demo queue.
x-live-runtime: &live-runtime
  API_ENV: development
  API_MODEL_MODE: live
  HERITAGE_CONFIG: config/hanoi-evidence.yaml
  API_EMBEDDED_WORKER: "false"
  PYTHON_DOTENV_DISABLED: "1"
  DATABASE_URL: postgresql+psycopg://heritage_live:local-live-test-only@db:5432/heritage_live
  API_DATA_DIR: /app/data
  API_CATALOG_MEDIA_DIR: /app/catalog-media
  API_LOG_DIR: /app/data/logs
  API_RETENTION_CLEANUP_INTERVAL_SECONDS: "3600"
  API_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://127.0.0.1:5175
  API_BOOTSTRAP_TOKEN: ""
  API_OPERATIONS_TOKEN: ""
  API_MAX_ACTIVE_PER_OWNER: "1"
  API_MAX_RUNS_PER_DAY: "3"
  LANGSMITH_TRACING: "false"
  LANGSMITH_CAPTURE_CONTENT: "false"
  LANGSMITH_API_KEY: ""

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: heritage_live
      POSTGRES_USER: heritage_live
      POSTGRES_PASSWORD: local-live-test-only
    volumes:
      - live_test_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage_live -d heritage_live"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    logging: *logging
    image: heritage-frontend-backend:demo
    pull_policy: never
    env_file: ../../.env
    environment: *live-runtime
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - live_test_assets:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  worker:
    logging: *logging
    image: heritage-frontend-backend:demo
    pull_policy: never
    command: ["python", "-m", "api.worker"]
    env_file: ../../.env
    environment: *live-runtime
    volumes:
      - live_test_assets:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://api:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  seed-catalog:
    profiles: ["tools"]
    image: heritage-frontend-backend:demo
    pull_policy: never
    logging: *logging
    command: ["python", "-m", "scripts.seed_catalog"]
    environment:
      <<: *live-runtime
      API_MODEL_MODE: demo
    depends_on:
      db:
        condition: service_healthy

volumes:
  live_test_postgres:
  live_test_assets:
