[project]
name = "heritage-vqa"
version = "0.2.0"
description = "Vietnamese heritage VQA with a shared LangGraph workflow"
requires-python = ">=3.12,<3.15"
dependencies = [
  "streamlit>=1.49,<2",
  "google-genai>=2,<3",
  "openai>=2,<4",
  "pillow>=10,<14",
  "python-dotenv>=1,<2",
  "pydantic>=2,<3",
  "requests>=2.32,<3",
  "pyyaml>=6,<7",
  "langgraph>=1,<2",
  "langsmith>=0.14.14,<0.15",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
